<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-label="ecoz: your Linux laptop and Android phone, working as one">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1b1f4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c6cf0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c6cf0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>
  <ellipse cx="700" cy="210" rx="520" ry="200" fill="url(#glow)"/>

  <!-- laptop -->
  <g transform="translate(58 118)" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <rect x="22" y="0" width="196" height="124" rx="12"/>
    <path d="M0 148 H240 L224 164 H16 Z"/>
    <path d="M70 62 L100 84 L162 36" stroke-width="7"/>
  </g>

  <!-- phone -->
  <g transform="translate(1228 96)" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <rect x="0" y="0" width="118" height="206" rx="22"/>
    <path d="M46 18 H72"/>
    <circle cx="59" cy="184" r="5"/>
    <path d="M32 96 L52 114 L88 72" stroke-width="7"/>
  </g>

  <!-- the link between them -->
  <path d="M316 186 C 500 62, 900 62, 1216 186" fill="none" stroke="url(#accent)" stroke-width="4" stroke-dasharray="3 14" stroke-linecap="round" opacity="0.9"/>
  <circle cx="316" cy="186" r="7" fill="#22d3ee"/>
  <circle cx="1216" cy="186" r="7" fill="#a78bfa"/>

  <!-- words -->
  <text x="700" y="208" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="800" fill="#ffffff" letter-spacing="-3">ecoz</text>
  <text x="700" y="274" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="500" fill="#c7d2fe">Your Linux laptop and Android phone, working as one.</text>
  <text x="700" y="326" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#94a3b8" letter-spacing="1">Links  ·  Clipboard  ·  Notifications  ·  Files  ·  Auto-lock &amp; Unlock</text>
</svg>
