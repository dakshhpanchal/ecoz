<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="624" viewBox="0 0 1200 624" role="img" aria-label="How ecoz works: the phone app and the laptop service talk over pinned TLS on your Wi-Fi or hotspot, a Bluetooth beacon tells the laptop the phone is close, and a hardware key on the phone signs unlock challenges.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1b1f4a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#22d3ee"/></marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#a78bfa"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#34d399"/></marker>
    <marker id="arrW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#94a3b8"/></marker>
    <style>
      text { font-family: Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .panel-title { font-size: 22px; font-weight: 700; fill: #ffffff; }
      .panel-sub { font-size: 15px; fill: #94a3b8; }
      .chip-title { font-size: 19px; font-weight: 650; fill: #f1f5f9; }
      .chip-sub { font-size: 14.5px; fill: #94a3b8; }
      .pill { font-size: 15px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="624" rx="28" fill="url(#bg)"/>

  <!-- panels -->
  <rect x="36" y="36" width="352" height="528" rx="22" fill="#ffffff" fill-opacity="0.045" stroke="#334155" stroke-width="1.5"/>
  <rect x="812" y="36" width="352" height="528" rx="22" fill="#ffffff" fill-opacity="0.045" stroke="#334155" stroke-width="1.5"/>
  <text x="62" y="82" class="panel-title">Phone</text>
  <text x="62" y="106" class="panel-sub">Android app · Kotlin · Compose</text>
  <text x="838" y="82" class="panel-title">Laptop</text>
  <text x="838" y="106" class="panel-sub">Linux service · Python · GNOME</text>

  <!-- lane 1: the network link -->
  <rect x="62" y="148" width="300" height="86" rx="16" fill="#0f1733" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="2"/>
  <text x="82" y="184" class="chip-title">Share · notifications</text>
  <text x="82" y="208" class="chip-sub">clipboard · files · find my phone</text>
  <rect x="838" y="148" width="300" height="86" rx="16" fill="#0f1733" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="2"/>
  <text x="858" y="184" class="chip-title">HTTPS service</text>
  <text x="858" y="208" class="chip-sub">event stream to the phone</text>
  <path d="M366 191 H834" stroke="#22d3ee" stroke-width="3.5" marker-start="url(#arrC)" marker-end="url(#arrC)"/>
  <rect x="438" y="172" width="324" height="38" rx="19" fill="#0b1020" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="600" y="197" text-anchor="middle" class="pill" fill="#67e8f9">pinned TLS · your Wi-Fi or hotspot</text>

  <!-- lane 2: the Bluetooth beacon -->
  <rect x="62" y="284" width="300" height="86" rx="16" fill="#0f1733" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="2"/>
  <text x="82" y="320" class="chip-title">Bluetooth beacon</text>
  <text x="82" y="344" class="chip-sub">rotates every 30 s · signed</text>
  <rect x="838" y="284" width="300" height="86" rx="16" fill="#0f1733" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="2"/>
  <text x="858" y="320" class="chip-title">Presence scanner</text>
  <text x="858" y="344" class="chip-sub">near · mid · away (BlueZ)</text>
  <path d="M366 327 H834" stroke="#a78bfa" stroke-width="3.5" stroke-dasharray="3 11" stroke-linecap="round" marker-end="url(#arrV)"/>
  <rect x="470" y="308" width="260" height="38" rx="19" fill="#0b1020" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="600" y="333" text-anchor="middle" class="pill" fill="#c4b5fd">Bluetooth LE signal</text>

  <!-- lane 3: the hardware key -->
  <rect x="62" y="420" width="300" height="86" rx="16" fill="#0f1733" stroke="#34d399" stroke-opacity="0.7" stroke-width="2"/>
  <text x="82" y="456" class="chip-title">Hardware key</text>
  <text x="82" y="480" class="chip-sub">works only while the phone is unlocked</text>
  <rect x="838" y="420" width="300" height="86" rx="16" fill="#0f1733" stroke="#34d399" stroke-opacity="0.7" stroke-width="2"/>
  <text x="858" y="456" class="chip-title">Auto-lock · Unlock</text>
  <text x="858" y="480" class="chip-sub">checks distance, touch and signature</text>
  <path d="M366 463 H834" stroke="#34d399" stroke-width="3.5" stroke-dasharray="3 11" stroke-linecap="round" marker-end="url(#arrG)"/>
  <rect x="456" y="444" width="288" height="38" rx="19" fill="#0b1020" stroke="#34d399" stroke-width="1.5"/>
  <text x="600" y="469" text-anchor="middle" class="pill" fill="#6ee7b7">signs the unlock challenge</text>

  <!-- laptop: the scanner feeds the lock logic -->
  <path d="M988 374 V416" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrW)"/>

  <text x="600" y="598" text-anchor="middle" font-size="15" fill="#64748b">Everything stays on your own network · no cloud · no account</text>
</svg>
